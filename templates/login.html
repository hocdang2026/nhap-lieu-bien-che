{% extends 'base.html' %}{% block content %}
<div class="card login-card">
  <span class="login-badge">TRUY CẬP AN TOÀN</span>
  <h1>Đăng nhập hệ thống</h1>
  <p class="muted">Mỗi đơn vị sử dụng tài khoản và mật khẩu riêng để nhập dữ liệu.</p>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>Tên đăng nhập</label>
    <input name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required autofocus>
    <label>Mật khẩu</label>
    <input type="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
    <button class="primary big" type="submit">ĐĂNG NHẬP</button>
  </form>
  <div class="form-note helper">Nếu không đăng nhập được, vui lòng liên hệ quản trị viên để kiểm tra tài khoản.</div>
</div>
{% endblock %}
