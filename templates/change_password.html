{% extends 'base.html' %}{% block content %}
<div class="card narrow">
  <span class="login-badge">BẢO MẬT TÀI KHOẢN</span><h1>Đổi mật khẩu</h1>
  {% if me['must_change_password'] %}<div class="alert warning">Đây là lần đăng nhập đầu tiên. Bạn phải đổi mật khẩu tạm trước khi nhập dữ liệu.</div>{% endif %}
  <form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Mật khẩu hiện tại</label><input type="password" name="old_password" required><label>Mật khẩu mới</label><input type="password" name="new_password" minlength="8" required><div class="helper">Tối thiểu 8 ký tự, nên có chữ hoa, chữ thường và số.</div><label>Nhập lại mật khẩu mới</label><input type="password" name="confirm_password" minlength="8" required><button class="primary big">LƯU MẬT KHẨU</button></form>
</div>
{% endblock %}
